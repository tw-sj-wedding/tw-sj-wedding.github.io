# 하객 리더보드 Worker. 배포 절차는 worker/README.md
name = "tw-sj-wedding-leaderboard"
main = "src/index.js"
compatibility_date = "2026-09-01"

[[d1_databases]]
binding = "DB"
database_name = "tw-sj-wedding-leaderboard"
# `npx wrangler d1 create tw-sj-wedding-leaderboard` 가 출력한 값 (공개해도 되는 값)
database_id = "dcec0653-19c2-4954-8275-3d971a24e465"
migrations_dir = "migrations"

[vars]
ALLOWED_ORIGINS = "https://tw-sj-wedding.github.io"
# game/src/config.js 의 GAME_VERSION. 점수 공식이 바뀌면 함께 올린다 (쉼표로 여러 개 허용)
CLIENT_VERSIONS = "2.1.0"

# HMAC_SECRET 은 여기 적지 않는다: `npx wrangler secret put HMAC_SECRET`
